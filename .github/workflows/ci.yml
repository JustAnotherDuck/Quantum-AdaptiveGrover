name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint and type-check
        run: |
          .venv/bin/python -m ruff check src tests experiments scripts demo
          .venv/bin/python -m mypy src

      - name: Run test suite with coverage
        env:
          MPLCONFIGDIR: /tmp/mpl
        run: |
          .venv/bin/python -m pytest tests --cov=src/agqca --cov-report=term-missing --cov-report=xml

      - name: Test push-button reproducibility
        env:
          MPLCONFIGDIR: /tmp/mpl
        run: |
          .venv/bin/python experiments/run_all.py --mode small
          .venv/bin/python scripts/generate_figures.py
          .venv/bin/python scripts/export_tables.py
